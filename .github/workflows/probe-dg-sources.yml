name: Probe DG sources

# A one-off survey of public sources for dangerous goods data. The development
# environment has no outbound network, a runner does. This workflow fetches
# nothing that ends up in the repo: it looks at whether a source exists and
# whether it can be read by machine, and puts the outcome in the run log. See
# scripts/probe_dg_sources.py for exactly what is asked.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which source to survey"
        type: choice
        options: [all, model-regs, cepa, dgl, dgl-survey, dgl-trial]
        default: all
      sample_pages:
        description: "Dangerous Goods List pages to sample in the log"
        # List pages, not just any pages of the document: outside them there is
        # no table to be found and the probe only reports that there is no column
        # layout.
        default: "600,627,700"
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet pymupdf

      - name: Probe
        if: ${{ contains(fromJSON('["all","model-regs","cepa","dgl"]'), inputs.source) }}
        run: python scripts/probe_dg_sources.py "${{ inputs.source }}" --sample-pages "${{ inputs.sample_pages }}"

      - name: Survey the Dangerous Goods List
        if: ${{ inputs.source == 'dgl-survey' }}
        run: python scripts/survey_imdg_dgl.py --sample-pages "${{ inputs.sample_pages }}"

      # A trial on a handful of pages before the whole list is read: the detected
      # column boundaries and the outcome per substance can then still be
      # checked. Records nothing.
      - name: Trial run on a few pages
        if: ${{ inputs.source == 'dgl-trial' }}
        run: python scripts/extract_imdg_dgl.py --dry-run --debug --pages "${{ inputs.sample_pages }}"
