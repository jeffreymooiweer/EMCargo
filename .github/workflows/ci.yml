name: CI

# Tests and image inspection run independently of outstanding publication rights.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Whoever pushes three times in a row does not need the result of the first two.
# On main and on a tag everything runs to the end: a publication hangs off those.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt

      # This gate deliberately comes *before* the installation: it costs a second
      # and catches the mistake the release workflow used to repair on main.
      - name: Check version consistency
        run: python scripts/check_versions.py

      - run: pip install -r backend/requirements.txt

      - name: Install local document OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-nld tesseract-ocr-deu tesseract-ocr-fra

      - name: Validate installed Python dependencies
        run: pip check

      # DATA_DIR and DATABASE_URL point at /data by default and that does not
      # exist here; the backend seeds its catalogues into that folder at startup.
      - name: Tests
        working-directory: backend
        env:
          DATA_DIR: ${{ github.workspace }}/data
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/test.db
          APP_ENV: test
          APP_SECRET_KEY: ci-secret
          CATALOG_AUTO_SYNC: "false"
        run: |
          mkdir -p "${{ github.workspace }}/data"
          python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 requires "^22.22.2 || ^24.15.0 || >=26" and undici 8 ">=22.19.0".
          # On Node 20 `npm test` falls over before a single test runs, with
          # "webidl.util.markAsUncloneable is not a function" from undici.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
      - name: Record installed production JavaScript dependencies
        run: cp dist/compliance/frontend.cdx.json ../compliance/frontend.cdx.json
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: compliance/frontend.cdx.json

  rights:
    name: Rights inventory
    runs-on: ubuntu-latest
    outputs:
      image_ready: ${{ steps.review.outputs.image_ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate registered content and evidence
        run: python scripts/check_third_party_manifest.py
      - name: Record exact source files
        run: python scripts/build_source_sbom.py --out compliance-output/source.cdx.json
      - name: Report publication readiness
        id: review
        run: |
          if python scripts/check_third_party_manifest.py --publish image --report compliance-output/image-rights.json; then
            echo "image_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_ready=false" >> "$GITHUB_OUTPUT"
            echo "Image publication is held for the recorded rights decisions." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rights-report
          path: compliance-output/

  docker:
    name: Docker build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [backend, frontend, rights]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'
      - uses: docker/setup-buildx-action@v3
      - name: Build the image locally before any publication
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: emcargo-review:${{ matrix.arch }}
          cache-from: type=gha,scope=license-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=license-${{ matrix.arch }}
      - name: Confirm runtime and absence of PyMuPDF
        run: |
          docker run --rm --entrypoint python emcargo-review:${{ matrix.arch }} -c "import importlib.util; assert importlib.util.find_spec('fitz') is None; assert importlib.util.find_spec('pymupdf') is None; import app.main"
          docker run --rm --entrypoint python -e PYTHONPATH=/app/backend -v "$PWD/scripts/check_assistant_runtime.py:/tmp/check_assistant_runtime.py:ro" emcargo-review:${{ matrix.arch }} /tmp/check_assistant_runtime.py
      - name: Inventory the built image, including OS and native libraries
        uses: anchore/sbom-action@v0
        with:
          image: emcargo-review:${{ matrix.arch }}
          format: cyclonedx-json
          output-file: image-${{ matrix.arch }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Report package obligations
        run: python scripts/check_sbom.py image-${{ matrix.arch }}.cdx.json --channel image --report image-${{ matrix.arch }}-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-sbom-${{ matrix.arch }}
          path: |
            image-${{ matrix.arch }}.cdx.json
            image-${{ matrix.arch }}-review.json
      - name: Require reviewed packages before publishing this exact image
        if: github.event_name != 'pull_request' && needs.rights.outputs.image_ready == 'true'
        run: python scripts/check_sbom.py image-${{ matrix.arch }}.cdx.json --channel image --publish
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && needs.rights.outputs.image_ready == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned architecture image
        if: github.event_name != 'pull_request' && needs.rights.outputs.image_ready == 'true'
        run: |
          docker tag emcargo-review:${{ matrix.arch }} ghcr.io/jeffreymooiweer/emcargo:${{ github.sha }}-${{ matrix.arch }}
          docker push ghcr.io/jeffreymooiweer/emcargo:${{ github.sha }}-${{ matrix.arch }}

  publish-image:
    name: Publish reviewed image manifest
    needs: [docker, rights]
    if: github.event_name != 'pull_request' && needs.rights.outputs.image_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine the two reviewed images
        env:
          COMMIT: ${{ github.sha }}
          IMAGE: ghcr.io/jeffreymooiweer/emcargo
        run: docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:${COMMIT:0:7}" "$IMAGE:$COMMIT-amd64" "$IMAGE:$COMMIT-arm64"
