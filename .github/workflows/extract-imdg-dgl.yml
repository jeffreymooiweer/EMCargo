name: Extract IMDG Dangerous Goods List

# Reads out the Dangerous Goods List of chapter 3.2 and puts it as a factual
# table in backend/seed/dg/imdg_dgl.json: per UN number the class, the packing
# group, the special provisions, the packing instructions, the EmS codes and —
# the most important for this app — the stowage and segregation codes of columns
# 16a and 16b.
#
# Runs here and not locally because the development environment has no outbound
# network. The script checks itself against class from ADR Table A and EmS from
# the EmS Guide and refuses to write out as soon as the agreement drops below the
# threshold; a shifted column does not get through unnoticed that way.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the result to this branch"
        type: boolean
        default: false
      min_agreement:
        description: "Below this agreement nothing is written"
        default: "0.99"
      show_un:
        description: "These UN numbers in full in the log, to chase down a discrepancy"
        default: ""
        required: false

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet pymupdf

      # Without --commit this is a full read over the whole list that *does*
      # check everything and records nothing: the right way to see the counts and
      # the agreement before anything enters the repo.
      - name: Extract
        run: |
          python scripts/extract_imdg_dgl.py \
            --out backend/seed/dg/imdg_dgl.json \
            --min-agreement "${{ inputs.min_agreement }}" \
            --show-un "${{ inputs.show_un }}" \
            ${{ inputs.commit && ' ' || '--dry-run' }}

      - name: Commit
        if: ${{ inputs.commit }}
        run: |
          set -eu
          # git diff does not see a new file: that is untracked.
          if [ -z "$(git status --porcelain -- backend/seed/dg/imdg_dgl.json)" ]; then
            echo "Unchanged; nothing to commit."
            exit 0
          fi
          ls -l backend/seed/dg/imdg_dgl.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/seed/dg/imdg_dgl.json
          git commit \
            -m "Read the Dangerous Goods List of IMDG Amendment 42-24" \
            -m "Column 16b takes precedence over the segregation table under 7.2.3.1, and until now the app only knew that column for the substances whose UN card happened to mention it. This is the column itself, for every entry in the list, alongside class, packing group, special provisions, packing instructions and EmS." \
            -m "Extracted by scripts/extract_imdg_dgl.py, which checks itself against class from ADR Table A and EmS from the EmS Guide and refuses to write below the agreement threshold. A factual table, not the regulatory text."
          python scripts/check_third_party_manifest.py --publish source
          git push
