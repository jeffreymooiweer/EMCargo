name: Extract IMDG codes

# Reads the stowage, handling and segregation codes with their description out of
# chapters 7.1.5, 7.1.6 and 7.2.8 of the IMDG Code and puts the result as a
# factual code table in backend/seed/dg/imdg_codes.json.
#
# Runs here and not locally because the development environment has no outbound
# network. Only the derived table is recorded, never the source text.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the result to this branch"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet pymupdf

      - name: Extract
        run: python scripts/extract_imdg_codes.py --out backend/seed/dg/imdg_codes.json

      - name: Commit
        if: ${{ inputs.commit }}
        run: |
          set -eu
          # git diff does not see a new file: that is untracked. On the first run
          # there was therefore nothing to record while the table had simply been
          # written.
          if [ -z "$(git status --porcelain -- backend/seed/dg/imdg_codes.json)" ]; then
            echo "Unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/seed/dg/imdg_codes.json
          git commit \
            -m "Read the IMDG 16a and 16b code descriptions from chapter 7" \
            -m "The app knew which stowage, handling and segregation codes a substance carries but could only show fragments of wording scraped from the UN cards. These come from 7.1.5, 7.1.6 and 7.2.8 themselves." \
            -m "Extracted by scripts/extract_imdg_codes.py; a factual code table, not the regulatory text."
          python scripts/check_third_party_manifest.py --publish source
          git push
